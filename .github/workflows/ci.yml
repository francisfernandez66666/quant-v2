# CI — 持续集成门禁（§GAP7.3）
# 此前仓库无任何 CI：gofmt/vet/test/-race/pytest 无强制门禁，flaky 测试无兜底捕获。
# English: CI gates — gofmt/vet/build + full go test (-race on this runner) + Python gateway pytest.
name: ci

on:
  push:
    branches: [main, enhanced]
  pull_request:

jobs:
  # §GAP2-W1 密钥泄漏扫描门禁：keystore 口令曾明文入库（mobile/gradle.properties），
  # gitleaks 全量扫描历史与工作区，防止同类事故再次入库。
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks 需要完整历史才能扫描全部提交

      - name: gitleaks（密钥泄漏扫描）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt（格式检查，输出 diff）
        run: |
          test -z "$(gofmt -l internal cmd)" || {
            echo "以下文件未格式化："
            gofmt -l internal cmd
            exit 1
          }

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race)
        # -race 全量：调度器/引擎等并发包的历史数据竞争靠它兜底捕获
        run: go test ./... -count=1 -race

  python-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # qmt_gateway/requirements.txt 仅注释（xtquant 为 Windows 专属，PyPI 不可装）
          pip install pytest

      - name: pytest（qmt_gateway 资金安全回归）
        working-directory: qmt_gateway
        run: python -m pytest tests/ -q

      - name: pydata server 语法检查
        run: python -m py_compile cmd/pydata/server.py scripts/bj_reinject.py scripts/export_fina_sql.py scripts/load_finance.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      # §N-1（2026-09-22 傍晚批）静态门禁：ESLint 以 --quiet 跑 = **只让 error 判红**（存量
      # no-unused-vars 104 条按预授权降 warn，不阻塞），而 no-undef 锁在 error 档——正是本批
      # 事故形态（Dashboard.jsx 调用未声明的 setQMTState，被空 catch 吞掉 → 实盘链路永不渲染，
      # 类型检查与 vitest 都抓不到）。不进门禁 = 同类拼写错误下次照样静默上线。
      - name: Lint（§N-1 no-undef 静态门禁，--quiet 只判 error）
        working-directory: web
        run: npm run lint -- --quiet

      - name: Test（§WS-I vitest 门禁：SSE 票据/认证/UI 组件回归）
        working-directory: web
        run: npm test

      - name: Build（§R4-10 前端构建门禁：JSX 语法/路由懒加载分包/vendor 拆分回归）
        working-directory: web
        run: npm run build

  # §FIX-5 UAT 自举脚本静态守卫：全栈 UAT 流程必须可从本地一键复跑。
  # 背景：mock+engine+前端+seed 的启动流程此前只内联在 nightly-e2e.yml，本机无处可跑；
  # 脚本退化成空脚本/被误删将导致 UAT 再次不可复跑——用静态守卫锁死。
  uat-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uat_bootstrap.sh 静态守卫
        run: |
          ub=scripts/uat_bootstrap.sh
          test -f "$ub" || { echo "缺 $ub"; exit 1; }
          test -x "$ub" || { echo "$ub 不可执行"; exit 1; }
          bash -n "$ub" || { echo "$ub 语法错误"; exit 1; }
          grep -q 'api/paper/buy' "$ub" || { echo "$ub 缺模拟盘持仓 seed"; exit 1; }
          grep -q 'market_risk_daily' "$ub" || { echo "$ub 缺情绪日线 seed"; exit 1; }
          grep -q 'api/tenants/t_default' "$ub" || { echo "$ub 缺租户配额上调"; exit 1; }
          grep -q 'sell_unified_mode' "$ub" || { echo "$ub 缺 §SELLPOINT-UNIFY 卖出统一模式 seed（应与 nightly 同口径显式 pin shadow）"; exit 1; }
          echo "ok - uat_bootstrap.sh 自举流程完整"

      # §SELLPOINT-UNIFY（2026-09-21）卖出并轨静态锁：go 测试矩阵已随 `go test ./...` 全量覆盖
      # （signalctl/sell_test、engine 影子与切闸、trading fromSignal、combat_agent 派发门、
      # data cleaner、e2e 全链路），此处只补「防复活」类守卫——回归测试会随重构漂移，
      # 而这些负向锁是 owner 拍板语义的物理保证（scripts/verify_changes.sh §27 同口径子集）。
      - name: §SELLPOINT-UNIFY 卖出并轨静态锁
        run: |
          bash -n scripts/verify_changes.sh || { echo "verify_changes.sh 语法错误"; exit 1; }
          # 锁① 利空/抛售子串→止损高 的映射必须已物理删除（护栏①，防复活）
          if grep -q 'Contains(sig.Reason, "利空")' internal/trading/advice.go; then
            echo "advice.go 利空子串→止损映射复活（§SELLPOINT 护栏①）"; exit 1
          fi
          # 锁② 派发判据三要素 + 两轮确认状态机在位（P4 缺陷1/2）
          grep -q 'md.ChangePct <= -1.5' internal/combat_agent/sell_side.go || { echo "派发跌幅下限丢失"; exit 1; }
          grep -q 'q.Volume >= avgV' internal/combat_agent/sell_side.go || { echo "缩量地板丢失"; exit 1; }
          grep -q 'distributionRatioThreshold' internal/combat_agent/sell_side.go || { echo "时段阈值未接线"; exit 1; }
          grep -q 'distConfirmed' internal/combat_agent/sell_side.go || { echo "两轮确认状态机丢失"; exit 1; }
          # 锁③ 灰度开关在位且提交口径绝不默认 on（三态 ""/shadow→off→on，切闸须 owner 手动改配置）
          grep -q 'SellUnifiedMode' internal/config/config.go || { echo "sell_unified_mode 配置项缺失"; exit 1; }
          if grep -rn --exclude=ci.yml --include='*.go' --include='*.sh' --include='*.yml' \
              'SellUnifiedMode: *"on"\|"sell_unified_mode": *"on"' \
              internal/ scripts/ .github/workflows/ | grep -v '_test.go'; then
            echo "提交内容中出现 sell_unified_mode=on 硬编码（切闸只允许运行期配置）"; exit 1
          fi
          # 锁④ paper 自动卖出唯一出口 + 主循环每轮裁决钩子（P3 双账一口径）
          grep -q 'func (e \*Engine) ApplyUnifiedSell' internal/paper/unified_sell.go || { echo "paper 统一出口缺失"; exit 1; }
          grep -q 'judgePaperLedgers' internal/engine/engine.go || { echo "主循环 paper/report 裁决未接线"; exit 1; }
          # 锁⑤ CI 两套 UAT 栈（nightly / 本机自举）必须显式 pin shadow，防"未配置即随机模式"漂移
          grep -q '"sell_unified_mode": "shadow"' .github/workflows/nightly-e2e.yml || { echo "nightly-e2e 未显式 pin shadow"; exit 1; }
          # 锁⑥ §C2（2026-09-22）深破升级不得回到只认止损线的旧形态：
          # `line == SellLineDeepBreach && st.Line == SellLineStopLoss` 前置条件一旦复活，
          # 止盈/移动止盈锁线砸穿 −12% 又会绕过边界④（FIX#12 事故形态）。
          if grep -q 'SellLineDeepBreach && st.Line == SellLineStopLoss' internal/signalctl/sell.go; then
            echo "sell.go 深破升级复活 StopLoss 前置条件（§C2 回归，边界④被架空）"; exit 1
          fi
          echo "ok - §SELLPOINT-UNIFY 静态锁 6 道全过"

      # §20260922 修复批（FIX_PLAN_20260922）静态锁：P0/P1/P2 十八项的 CI 侧子集，
      # 与 scripts/verify_changes.sh §28~§37 同口径——行为回归随重构漂移，这里只钉
      # 「负向防复活」语义（资金安全/越权/假成功/静默丢弃四族）。
      - name: §20260922 修复批静态锁
        run: |
          # §C1 冻结账：当日过滤 + 吞错单值形态不得复活
          grep -A6 'func (d \*DB) LocalBuyFrozen' internal/store/real_positions.go | grep -q "substr(created_at,1,10)=?" || { echo "LocalBuyFrozen 日期过滤丢失（§C1）"; exit 1; }
          if grep -q 'frozen := g.st.LocalBuyFrozen' internal/risk/gate.go; then echo "冻结账读取错误被吞（§C1 fail-open 复活）"; exit 1; fi
          grep -q 'lastStaleSweepAt' internal/trading/controller.go || { echo "§C1b 跨日清扫节流戳丢失"; exit 1; }
          # §F1/§F12 费用腿与成交额单口径
          grep -q 'sellPnl := (f.Price-ps.cost)\*float64(sellQty) - (f.Fee + f.StampTax)' internal/server/qmt.go || { echo "trades 重放卖出费用减项丢失（§F1）"; exit 1; }
          grep -q 'f.Price\*float64(f.Qty) + f.Fee) / float64(newQty)' internal/store/real_positions.go || { echo "ApplyRealFill 加仓含费摊薄丢失（§F1）"; exit 1; }
          # §H1 交割日期归一
          grep -q 'func normalizeSettleDay' internal/trading/settlement.go || { echo "§H1 归一函数丢失"; exit 1; }
          # §H2 跃迁判定值快照（防 prev/st 别名）
          grep -q 'prevSnap = \*prev' internal/signalctl/sell.go || { echo "§H2 快照丢失，VerdictHold 永不留痕复活"; exit 1; }
          # §H3 全局写端点收权
          grep -q 'POST /api/action", s.adminMiddleware(s.handleFixAction)' internal/server/server.go || { echo "/api/action 回退 authMiddleware（§H3）"; exit 1; }
          grep -q 'POST /api/news/reanalyze", s.adminMiddleware(s.handleNewsReanalyze)' internal/server/server.go || { echo "reanalyze 回退 authMiddleware（§H3）"; exit 1; }
          # §H4 卖单吞错防复活 + 减仓槽先成功后烧
          if grep -q '_ = e.sellRealPosition' internal/engine/scoring_loop.go; then echo "卖单错误回退吞错形态（§H4）"; exit 1; fi
          grep -q 'realTrimDone\[p.TsCode\] = trimDay' internal/engine/scoring_loop.go || { echo "减仓槽成功回写丢失（§H4）"; exit 1; }
          # §H5 新鲜度主判据
          grep -q 'at := sc.UpdatedAt' internal/engine/sell_shadow.go || { echo "新鲜度回退全局时钟（§H5）"; exit 1; }
          # §H6/§H7 前端 SSE 续传与登出闭包
          grep -q 'sseReconnectTimer' web/src/api/index.js || { echo "§H6 重建定时器丢失"; exit 1; }
          grep -q 'loggedInRef.current' web/src/App.jsx || { echo "§H7 登出回调读陈旧闭包复活"; exit 1; }
          # §H9 outbox 下标定位防复活
          if grep -q 'jobs = append(jobs, job{idx: i' internal/notify/outbox.go; then echo "pump 回退数组下标定位（§H9 风暴复活）"; exit 1; fi
          # §M16 网关 inflight 收割与桥回执
          grep -q 'inflight_at' qmt_gateway/store.py || { echo "§M16 取单时刻列丢失"; exit 1; }
          grep -q '_execute_diag' qmt_gateway/qmt_bridge.py || { echo "§M16 桥 diag 回执丢失（永挂复活）"; exit 1; }
          # §F2/§F5/§M5/§F3 回报接入段
          grep -q 'errors.Is(err, store.ErrInvalidPositionReport)' internal/server/qmt.go || { echo "§F2 校验失败 400 映射丢失"; exit 1; }
          if grep -q 'if ev.OrderID != "" && ev.SignalID != "" {' internal/server/qmt.go; then echo "缺键回报静默丢弃复活（§F5）"; exit 1; fi
          grep -q 'COALESCE(NULLIF(excluded.strategy' internal/store/real_positions.go || { echo "对账洗空保护丢失（§M5）"; exit 1; }
          grep -q 'muxWithJSONErrors' internal/server/server.go || { echo "404/405 JSON 信封丢失（§F3）"; exit 1; }
          grep -q 'can_use_qty' qmt_gateway/broker.py || { echo "xt 通道 T+1 可卖量字段丢失（§M5）"; exit 1; }
          # §M14/§M15 队列熔断与夜链自愈
          grep -q 'SameReasonFailLimit = 10' internal/store/research_tasks.go || { echo "§M14 阈值丢失"; exit 1; }
          if grep -q 'researchTaskRetryCap' internal/store/research_tasks.go; then echo "旧异因混计上限复活（§M14）"; exit 1; fi
          grep -q 'ChainTaskSeqs' internal/scheduler/worker.go || { echo "夜链序位补缺丢失（§M15）"; exit 1; }
          grep -q 'SetAlertFunc' cmd/researchd/main.go || { echo "researchd 告警未接线（§M14）"; exit 1; }
          # §H8/§F6 探针同源与构建指纹
          test -f deploy/qmt-win/service_probe_config.ps1 || { echo "§H8 探针同源配置缺失"; exit 1; }
          if grep -qE '127\.0\.0\.1:9091|127\.0\.0\.1:8080/api/status' deploy/qmt-win/all_service_watchdog.ps1 scripts/daily_ops_check.ps1; then echo "旧误熔探针形态复活（§H8）"; exit 1; fi
          grep -q 'main.buildCommit' scripts/uat_bootstrap.sh || { echo "UAT 构建指纹注入丢失（§F6）"; exit 1; }
          echo "ok - §20260922 修复批静态锁全过"

      - name: §20260922 修复批二波静态锁（M1~M13）
        run: |
          # §M1 行情源契约 golden 单源（散落六处 → contract/quote_sources.json）
          test -f qmt_gateway/contract/quote_sources.json || { echo "golden 源清单缺失（M1 各写各的复活）"; exit 1; }
          grep -q 'quote_sources.json' scripts/uat_bootstrap.sh || { echo "uat_bootstrap 未读 golden（§3.1-1 复活）"; exit 1; }
          grep -q 'quote_sources.json' web/e2e/quote_sources.mjs || { echo "E2E golden 加载器丢失（M1）"; exit 1; }
          # §M2/M3 降级报成功族
          grep -q 'last-known-good' internal/data/fetcher.go || { echo "M2 全源失败保底语义丢失"; exit 1; }
          grep -q 'NewsSourceHealth' internal/data/source.go || { echo "M3 真实探测结构丢失"; exit 1; }
          if grep -rn 'cainanshe' internal web/src cmd 2>/dev/null | grep -v '//' | grep -v '_test\.go' | grep -v Binary >/dev/null; then echo "笔误键 cainanshe 复活（M3）"; exit 1; fi
          # §M6/§TZ/§REJECT 数据管道 py 批
          grep -q 'INDEX_PCT_COL = "pctChg"' scripts/dataload_keepalive.py || { echo "M6 pctChg 契约键回退"; exit 1; }
          test -f qmt_gateway/contract/time_formats.json || { echo "时间格式 golden 缺失（§TZ/§3.1-5）"; exit 1; }
          if grep -rn --include='*.py' -E 'time\.strftime\([^)\n]*\+08:00' qmt_gateway scripts 2>/dev/null | grep -v '/tests/' >/dev/null; then echo "假 +08:00 裸 strftime 复活（§TZ）"; exit 1; fi
          grep -q '§REJECT' qmt_gateway/handler.py || { echo "双空回报入库拒收丢失（M-REJECT）"; exit 1; }
          grep -q '§REJECT' qmt_gateway/gateway.py || { echo "双空回报 400 拒收丢失（M-REJECT）"; exit 1; }
          # §M8 禁双发铁律：业务调用方不得在 Push 之外直调 PushGateway
          if grep -rn '\.PushGateway(' internal/engine cmd/quant --include='*.go' | grep -v _test.go | grep -v 'New.*Gateway' >/dev/null; then echo "M8 双发复活——业务侧绕过 Push 直调网关通道"; exit 1; fi
          grep -q 'gatewayMinLevel' internal/notify/notify.go || { echo "M8 网关级别闸丢失"; exit 1; }
          # §M9/M10/M11 快照与落盘批
          grep -q '轮首快照' internal/engine/engine.go || { echo "M9 轮首快照语义丢失"; exit 1; }
          grep -q 'paper_sell_anchors.json' internal/engine/sell_anchor.go || { echo "M10 锚点落盘丢失（重启清零复活）"; exit 1; }
          grep -q 'validateInsertSurface' internal/store/store.go || { echo "M11 InsertRows 面校验丢失"; exit 1; }
          # §M7 部署清单收编（web 注册 + 网关配置生成入链，静态锁总闸可跑则跑）
          grep -q 'register_web_service.ps1' scripts/deploy_guangzhou.sh || { echo "M7b web 注册脱链"; exit 1; }
          grep -q 'ensure_gateway_config.ps1' scripts/deploy_guangzhou.sh || { echo "M7c 网关配置生成脱链"; exit 1; }
          bash ./scripts/check_deploy_static_locks.sh || { echo "部署口径静态锁漂移（M7）"; exit 1; }
          # §M13 前端权限一致性（403 只认状态码；负锁过滤"旧写法不得复活"说明注释）
          if grep -nE "indexOf\('无权限'\)|includes\('无权限'\)" web/src/pages/Quant.jsx web/src/pages/Paper.jsx | grep -vE ':[0-9]+:[[:space:]]*//' >/dev/null; then echo "M13 中文文案判 403 复活"; exit 1; fi
          grep -q 'isForbidden' web/src/pages/Quant.jsx || { echo "M13 Quant 状态码判定丢失"; exit 1; }
          grep -q 'isForbidden' web/src/pages/Paper.jsx || { echo "M13 Paper 状态码判定丢失"; exit 1; }
          # §M12 移动壳：调试门控 + 注入转义
          grep -q 'BuildConfig.DEBUG' mobile/app/src/main/java/com/liangzai/quant/MainActivity.kt || { echo "M12 release 调试面复活"; exit 1; }
          grep -q 'jsQuote' mobile/app/src/main/java/com/liangzai/quant/MainActivity.kt || { echo "M12 注入转义通道丢失"; exit 1; }
          echo "ok - §20260922 修复批二波静态锁全过"

      - name: §20260922-C 批静态锁（XCHECK/NATIVEAUTH/ROOTQMT/APPVER）
        run: |
          # §XCHECK 价格复核闸：接线链与配置键在位；CrossCheckPrice 不得回到零消费者死代码
          grep -q 'price_cross_check' internal/risk/gate.go || { echo "XCHECK 复核闸从闸清单消失"; exit 1; }
          grep -q 'SetCrossPriceSource' internal/engine/registry.go || { echo "XCHECK registry 注入脱链"; exit 1; }
          grep -q 'cross_check_pct' internal/config/config.go || { echo "XCHECK 配置键丢失"; exit 1; }
          if ! grep -rn 'CrossCheckPrice' internal cmd --include='*.go' | grep -v _test.go | grep -v 'internal/data/source.go' | grep -q .; then echo "XCHECK 复活死代码形态：CrossCheckPrice 零生产消费者"; exit 1; fi
          # §NATIVEAUTH token 迁原生：桥/依赖/前端探测三件套；直读负锁（滤注释与存储层单点）
          test -f mobile/app/src/main/java/com/liangzai/quant/SecureAuthStore.kt || { echo "NATIVEAUTH 原生加密存储缺失"; exit 1; }
          grep -q '"AndroidAuth"' mobile/app/src/main/java/com/liangzai/quant/MainActivity.kt || { echo "NATIVEAUTH 桥未注册"; exit 1; }
          grep -q 'security-crypto' mobile/app/build.gradle.kts || { echo "NATIVEAUTH 依赖丢失"; exit 1; }
          grep -q 'nativeAuthBridge' web/src/api/index.js || { echo "NATIVEAUTH 前端桥探测丢失"; exit 1; }
          if grep -rn "liangzai_token" web/src --include='*.js' --include='*.jsx' | grep -v __tests__ | grep -v 'src/api/index.js' | grep -vE ':[0-9]+:[[:space:]]*//' | grep -q .; then echo "NATIVEAUTH 业务代码直读 token 复活"; exit 1; fi
          # §ROOTQMT 死键防回潮：清理脚本在位且挂部署链
          test -f deploy/qmt-win/clean_root_qmt.ps1 || { echo "ROOTQMT 清理脚本缺失"; exit 1; }
          grep -q 'clean_root_qmt' scripts/deploy_guangzhou.sh || { echo "ROOTQMT 清理脱部署链（防回潮失效）"; exit 1; }
          # §APPVER 强制更新通道：公开端点（不得套鉴权）+ /dl 分发 + 原生闸 + 版本跃迁
          grep -q 'GET /api/app/version' internal/server/server.go || { echo "APPVER 版本端点丢失"; exit 1; }
          if grep -n 'GET /api/app/version' internal/server/server.go | grep -q 'authMiddleware'; then echo "APPVER 端点被套鉴权（登录前检查死锁复活）"; exit 1; fi
          grep -q 'handle /dl/\*' deploy/caddy/guangzhou.conf || { echo "APPVER Caddy 分发块丢失"; exit 1; }
          grep -q 'quant-latest.apk' scripts/deploy_guangzhou.sh || { echo "APPVER APK 同步步丢失"; exit 1; }
          grep -q 'UpdateGate' mobile/app/src/main/java/com/liangzai/quant/MainActivity.kt || { echo "APPVER 原生更新闸未接线"; exit 1; }
          grep -qE 'versionCode = ([2-9]|[1-9][0-9])' mobile/app/build.gradle.kts || { echo "APPVER 版本停在没有更新通道的 1"; exit 1; }
          echo "ok - §20260922-C 批静态锁全过"
