# CI — 持续集成门禁（§GAP7.3）
# 此前仓库无任何 CI：gofmt/vet/test/-race/pytest 无强制门禁，flaky 测试无兜底捕获。
# English: CI gates — gofmt/vet/build + full go test (-race on this runner) + Python gateway pytest.
name: ci

on:
  push:
    branches: [main, enhanced]
  pull_request:

jobs:
  # §GAP2-W1 密钥泄漏扫描门禁：keystore 口令曾明文入库（mobile/gradle.properties），
  # gitleaks 全量扫描历史与工作区，防止同类事故再次入库。
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks 需要完整历史才能扫描全部提交

      - name: gitleaks（密钥泄漏扫描）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt（格式检查，输出 diff）
        run: |
          test -z "$(gofmt -l internal cmd)" || {
            echo "以下文件未格式化："
            gofmt -l internal cmd
            exit 1
          }

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race)
        # -race 全量：调度器/引擎等并发包的历史数据竞争靠它兜底捕获
        run: go test ./... -count=1 -race

  python-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # qmt_gateway/requirements.txt 仅注释（xtquant 为 Windows 专属，PyPI 不可装）
          pip install pytest

      - name: pytest（qmt_gateway 资金安全回归）
        working-directory: qmt_gateway
        run: python -m pytest tests/ -q

      - name: pydata server 语法检查
        run: python -m py_compile cmd/pydata/server.py scripts/bj_reinject.py scripts/export_fina_sql.py scripts/load_finance.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Test（§WS-I vitest 门禁：SSE 票据/认证/UI 组件回归）
        working-directory: web
        run: npm test

      - name: Build（§R4-10 前端构建门禁：JSX 语法/路由懒加载分包/vendor 拆分回归）
        working-directory: web
        run: npm run build

  # §FIX-5 UAT 自举脚本静态守卫：全栈 UAT 流程必须可从本地一键复跑。
  # 背景：mock+engine+前端+seed 的启动流程此前只内联在 nightly-e2e.yml，本机无处可跑；
  # 脚本退化成空脚本/被误删将导致 UAT 再次不可复跑——用静态守卫锁死。
  uat-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uat_bootstrap.sh 静态守卫
        run: |
          ub=scripts/uat_bootstrap.sh
          test -f "$ub" || { echo "缺 $ub"; exit 1; }
          test -x "$ub" || { echo "$ub 不可执行"; exit 1; }
          bash -n "$ub" || { echo "$ub 语法错误"; exit 1; }
          grep -q 'api/paper/buy' "$ub" || { echo "$ub 缺模拟盘持仓 seed"; exit 1; }
          grep -q 'market_risk_daily' "$ub" || { echo "$ub 缺情绪日线 seed"; exit 1; }
          grep -q 'api/tenants/t_default' "$ub" || { echo "$ub 缺租户配额上调"; exit 1; }
          grep -q 'sell_unified_mode' "$ub" || { echo "$ub 缺 §SELLPOINT-UNIFY 卖出统一模式 seed（应与 nightly 同口径显式 pin shadow）"; exit 1; }
          echo "ok - uat_bootstrap.sh 自举流程完整"

      # §SELLPOINT-UNIFY（2026-09-21）卖出并轨静态锁：go 测试矩阵已随 `go test ./...` 全量覆盖
      # （signalctl/sell_test、engine 影子与切闸、trading fromSignal、combat_agent 派发门、
      # data cleaner、e2e 全链路），此处只补「防复活」类守卫——回归测试会随重构漂移，
      # 而这些负向锁是 owner 拍板语义的物理保证（scripts/verify_changes.sh §27 同口径子集）。
      - name: §SELLPOINT-UNIFY 卖出并轨静态锁
        run: |
          bash -n scripts/verify_changes.sh || { echo "verify_changes.sh 语法错误"; exit 1; }
          # 锁① 利空/抛售子串→止损高 的映射必须已物理删除（护栏①，防复活）
          if grep -q 'Contains(sig.Reason, "利空")' internal/trading/advice.go; then
            echo "advice.go 利空子串→止损映射复活（§SELLPOINT 护栏①）"; exit 1
          fi
          # 锁② 派发判据三要素 + 两轮确认状态机在位（P4 缺陷1/2）
          grep -q 'md.ChangePct <= -1.5' internal/combat_agent/sell_side.go || { echo "派发跌幅下限丢失"; exit 1; }
          grep -q 'q.Volume >= avgV' internal/combat_agent/sell_side.go || { echo "缩量地板丢失"; exit 1; }
          grep -q 'distributionRatioThreshold' internal/combat_agent/sell_side.go || { echo "时段阈值未接线"; exit 1; }
          grep -q 'distConfirmed' internal/combat_agent/sell_side.go || { echo "两轮确认状态机丢失"; exit 1; }
          # 锁③ 灰度开关在位且提交口径绝不默认 on（三态 ""/shadow→off→on，切闸须 owner 手动改配置）
          grep -q 'SellUnifiedMode' internal/config/config.go || { echo "sell_unified_mode 配置项缺失"; exit 1; }
          if grep -rn --exclude=ci.yml --include='*.go' --include='*.sh' --include='*.yml' \
              'SellUnifiedMode: *"on"\|"sell_unified_mode": *"on"' \
              internal/ scripts/ .github/workflows/ | grep -v '_test.go'; then
            echo "提交内容中出现 sell_unified_mode=on 硬编码（切闸只允许运行期配置）"; exit 1
          fi
          # 锁④ paper 自动卖出唯一出口 + 主循环每轮裁决钩子（P3 双账一口径）
          grep -q 'func (e \*Engine) ApplyUnifiedSell' internal/paper/unified_sell.go || { echo "paper 统一出口缺失"; exit 1; }
          grep -q 'judgePaperLedgers' internal/engine/engine.go || { echo "主循环 paper/report 裁决未接线"; exit 1; }
          # 锁⑤ CI 两套 UAT 栈（nightly / 本机自举）必须显式 pin shadow，防"未配置即随机模式"漂移
          grep -q '"sell_unified_mode": "shadow"' .github/workflows/nightly-e2e.yml || { echo "nightly-e2e 未显式 pin shadow"; exit 1; }
          echo "ok - §SELLPOINT-UNIFY 静态锁 5 道全过"
