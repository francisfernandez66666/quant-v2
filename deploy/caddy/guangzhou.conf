# quant-trading-v2 前端静态托管 + API/SSE 反向代理（Caddy - 广州版）
# 部署见 deploy/GUANGZHOU_CADDY.md；目标机 = 广州腾讯云轻量 Win Server 2022（81.71.69.17）。
#
# ⚠️ ICP 备案已完成（沪ICP备2026045551，2026-09）：域名 HTTPS 块已启用。
#    - 主入口：https://quant-trading.top（80/443，Caddy 自动签发 Let's Encrypt 证书）
#    - 过渡入口 :8080（IP/域名直连纯 HTTP）保留，作为证书签发失败/回滚时的应急通道
#    - 前端（web/dist）静态托管在 C:\opt\quant\web
#    - /api 前缀（REST + SSE）单独 handle 反代到后端引擎 127.0.0.1:8081，SSE 长连接天然透传
#    - §APPVER（2026-09-22 C批）：/dl/* 前缀 = 安装包分发目录 C:\opt\quant\apk（quant-latest.apk），
#      由 deploy_guangzhou.sh 步 [3c] 上传，配合 GET /api/app/version 做服务端驱动强制更新
#    - 按路径互斥的分支：/dl（落地页/APK）、/api/*（后端）、/assets/*（长缓存静态）、其余（SPA 入口）
#    - CORS 由后端 corsMiddleware 处理：无 Origin 回 *，有 Origin 仅回显白名单（不是“全开”）
#    - §F-04（D11 第一档）：/setup 默认不暴露公网，运维走 SSH 隧道直连 127.0.0.1:8081
#
# ── 域名 HTTPS 主入口（备案完成后启用，2026-09-15 起生效）──

quant-trading.top {
	# 传输压缩
	encode gzip

	# §F-08 站点级安全头：所有响应统一带；HSTS 首版不带 includeSubDomains
	# （DNS 侧其他子域尚未取证，先不把它们钉进强制 HTTPS）
	header {
		Strict-Transport-Security "max-age=31536000"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "same-origin"
		X-Frame-Options "DENY"
		-Server
	}

	# §F-04（D11 第一档）：初始化入口不公开；显式 404，避免被 SPA 兜底成 200 HTML
	handle /setup {
		respond 404
	}

	# §N-11a：/dl 无尾斜杠统一跳到落地页
	handle /dl {
		redir * /dl/ 301
	}

	# /dl/*：落地页（/dl/、/dl/index.html）优先，其余按 APK 文件分发
	handle /dl/* {
		@landing path /dl/ /dl/index.html
		handle @landing {
			root * C:\opt\quant\web
			rewrite * /dl/index.html
			file_server
		}

		# §APPVER（2026-09-22 C批）APK 分发目录：/dl/* → C:\opt\quant\apk（quant-latest.apk）
		# §F-06：补 Content-Type / Content-Disposition / Cache-Control；不上 immutable，保留 Range 断点续传
		handle {
			uri strip_prefix /dl
			root * C:\opt\quant\apk
			header {
				Content-Type "application/vnd.android.package-archive"
				Content-Disposition "attachment; filename=\"quant-latest.apk\""
				Cache-Control "no-cache"
			}
			file_server
		}
	}

	# 后端 API / SSE（handle 精确匹配 /api 前缀，反代内网引擎）
	handle /api/* {
		reverse_proxy 127.0.0.1:8081
	}

	# §F-13 匿名探活：必须显式反代，否则会被 SPA 兜底成 200 HTML（域名侧探针假绿）
	handle /livez {
		reverse_proxy 127.0.0.1:8081
	}
	handle /readyz {
		reverse_proxy 127.0.0.1:8081
	}

	# §F-01/§F-05：/assets/* 单独一条，严禁 try_files——否则缺失的哈希名会被回落成
	# index.html 200，把“404 不缓存”的判据直接废掉。
	# 默认 no-store 兜住 404；磁盘上真实存在的文件再覆盖成长缓存（哈希名本身已足够 immutable）。
	# 不用 handle_errors：官方文档未承诺“只写 header 不写响应”能作用到默认错误体。
	handle /assets/* {
		root * C:\opt\quant\web
		# route 保留字面顺序：后一条 @asset 覆盖必须在默认 no-store 之后执行，
		# 否则 Caddy 的同名指令排序会把“存在文件”的 immutable 又盖回 no-store（现网 G3 首跑实证）。
		route {
			header Cache-Control "no-store"
			@asset file {http.request.uri.path}
			header @asset Cache-Control "public, max-age=31536000, immutable"
			file_server
		}
	}

	# §F-01：SPA 深链回落（刷新/书签/微信点链接不再 0 字节白页）
	# 必须用 route 保留字面顺序：Caddy 默认指令序里 header 早于 try_files，
	# 平铺时 @html 看到的是原始请求路径，回落后的 index.html 就永远拿不到 no-store。
	handle {
		root * C:\opt\quant\web
		route {
			try_files {path} /index.html
			@html path / /index.html
			header @html Cache-Control "no-store"
			file_server
		}
	}

	# 请求体上限（新闻原文/LLM 咨询可能较大）
	request_body {
		max_size 10MB
	}

	# 日志
	log {
		output file C:\var\log\caddy\quant-trading.top.access.log {
			roll_size 10MiB
			roll_keep 5
		}
	}
}

# ── 过渡/应急入口（IP 直连 :8080，纯 HTTP）──
# 证书签发失败、备案核验期间或应急回滚时使用；正常用户请走 https://quant-trading.top。
# 与主站块保持同构：改一份等于只修一半。

:8080 {
	# 传输压缩
	encode gzip

	# §F-08 站点级安全头（与主站块同构）
	header {
		Strict-Transport-Security "max-age=31536000"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "same-origin"
		X-Frame-Options "DENY"
		-Server
	}

	# §F-04（D11 第一档）：初始化入口不公开
	handle /setup {
		respond 404
	}

	# §N-11a：/dl 无尾斜杠统一跳到落地页
	handle /dl {
		redir * /dl/ 301
	}

	# /dl/*：落地页优先，其余按 APK 文件分发
	handle /dl/* {
		@landing path /dl/ /dl/index.html
		handle @landing {
			root * C:\opt\quant\web
			rewrite * /dl/index.html
			file_server
		}

		# §APPVER（2026-09-22 C批）APK 分发目录
		# §F-06：三头齐备 + no-cache，保留 Range 断点续传
		handle {
			uri strip_prefix /dl
			root * C:\opt\quant\apk
			header {
				Content-Type "application/vnd.android.package-archive"
				Content-Disposition "attachment; filename=\"quant-latest.apk\""
				Cache-Control "no-cache"
			}
			file_server
		}
	}

	# 后端 API / SSE
	handle /api/* {
		reverse_proxy 127.0.0.1:8081
	}

	# §F-13 匿名探活：必须显式反代，否则会被 SPA 兜底成 200 HTML
	handle /livez {
		reverse_proxy 127.0.0.1:8081
	}
	handle /readyz {
		reverse_proxy 127.0.0.1:8081
	}

	# §F-01/§F-05：/assets/* 单独一条，严禁 try_files
	# 默认 no-store 兜住 404；磁盘上真实存在的文件再覆盖成长缓存
	handle /assets/* {
		root * C:\opt\quant\web
		# route 保留字面顺序：后一条 @asset 覆盖必须在默认 no-store 之后执行，
		# 否则 Caddy 的同名指令排序会把“存在文件”的 immutable 又盖回 no-store（现网 G3 首跑实证）。
		route {
			header Cache-Control "no-store"
			@asset file {http.request.uri.path}
			header @asset Cache-Control "public, max-age=31536000, immutable"
			file_server
		}
	}

	# §F-01：SPA 深链回落
	handle {
		root * C:\opt\quant\web
		route {
			try_files {path} /index.html
			@html path / /index.html
			header @html Cache-Control "no-store"
			file_server
		}
	}

	# 请求体上限（新闻原文/LLM 咨询可能较大）
	request_body {
		max_size 10MB
	}

	# 日志
	log {
		output file C:\var\log\caddy\quant.access.log {
			roll_size 10MiB
			roll_keep 5
		}
	}
}
