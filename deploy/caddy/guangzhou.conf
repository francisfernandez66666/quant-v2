# quant-trading-v2 前端静态托管 + API/SSE 反向代理（Caddy - 广州版）
# 部署见 deploy/GUANGZHOU_CADDY.md；目标机 = 广州腾讯云轻量 Win Server 2022（81.71.69.17）。
#
# ⚠️ ICP 备案已完成（沪ICP备2026045551，2026-09）：域名 HTTPS 块已启用。
#    - 主入口：https://quant-trading.top（80/443，Caddy 自动签发 Let's Encrypt 证书）
#    - 过渡入口 :8080（IP/域名直连纯 HTTP）保留，作为证书签发失败/回滚时的应急通道
#    - 前端（web/dist）静态托管在 C:\opt\quant\web
#    - /api 前缀（REST + SSE）单独 handle 反代到后端引擎 127.0.0.1:8081，SSE 长连接天然透传
#    - §APPVER（2026-09-22 C批）：/dl/* 前缀 = 安装包分发目录 C:\opt\quant\apk（quant-latest.apk），
#      由 deploy_guangzhou.sh 步 [3c] 上传，配合 GET /api/app/version 做服务端驱动强制更新
#    - 两个 handle 分支按路径互斥：/api/* → 后端；其余（/、/assets/* 等）→ 静态前端
#    - CORS 已由后端 corsMiddleware 全开（*），跨域 APK 走 /api 同样可用
#
# ── 域名 HTTPS 主入口（备案完成后启用，2026-09-15 起生效）──

quant-trading.top {
	# 传输压缩
	encode gzip

	# §APPVER（2026-09-22 C批）APK 分发目录：/dl/* → C:\opt\quant\apk（quant-latest.apk）
	handle /dl/* {
		uri strip_prefix /dl
		root * C:\opt\quant\apk
		file_server
	}

	# 后端 API / SSE（handle 精确匹配 /api 前缀，反代内网引擎）
	handle /api/* {
		reverse_proxy 127.0.0.1:8081
	}

	# 前端静态资源（其余所有路径）
	handle {
		root * C:\opt\quant\web
		file_server
		# §GAP-20260826 缓存策略：index.html 必须 no-cache——它是 SPA 的入口，
		# 浏览器/中间代理若启发式缓存旧 index.html，部署新版后用户仍加载旧 JS bundle，
		# 出现"新功能不存在/数据展示口径陈旧"的假故障。
		# 带 hash 的 /assets/* 内容不可变，可放心长缓存 immutable。
		@html path /
		header @html Cache-Control "no-store"
		@api path /api/*
		header @api Cache-Control "no-store"
		@assets path /assets/*
		header @assets Cache-Control "public, max-age=31536000, immutable"
	}

	# 请求体上限（新闻原文/LLM 咨询可能较大）
	request_body {
		max_size 10MB
	}

	# 日志
	log {
		output file C:\var\log\caddy\quant-trading.top.access.log {
			roll_size 10MiB
			roll_keep 5
		}
	}
}

# ── 过渡/应急入口（IP 直连 :8080，纯 HTTP）──
# 证书签发失败、备案核验期间或应急回滚时使用；正常用户请走 https://quant-trading.top。

:8080 {
	# 传输压缩
	encode gzip

	# §APPVER（2026-09-22 C批）APK 分发目录：/dl/* → C:\opt\quant\apk（quant-latest.apk）
	handle /dl/* {
		uri strip_prefix /dl
		root * C:\opt\quant\apk
		file_server
	}

	# 后端 API / SSE（handle 精确匹配 /api 前缀，反代内网引擎）
	handle /api/* {
		reverse_proxy 127.0.0.1:8081
	}

	# 前端静态资源（其余所有路径）
	handle {
		root * C:\opt\quant\web
		file_server
		@html path /
		header @html Cache-Control "no-store"
		@api path /api/*
		header @api Cache-Control "no-store"
		@assets path /assets/*
		header @assets Cache-Control "public, max-age=31536000, immutable"
	}

	# 请求体上限（新闻原文/LLM 咨询可能较大）
	request_body {
		max_size 10MB
	}

	# 日志
	log {
		output file C:\var\log\caddy\quant.access.log {
			roll_size 10MiB
			roll_keep 5
		}
	}
}
