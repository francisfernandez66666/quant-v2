# quant-trading-v2 前端静态托管 + API/SSE 反向代理（Caddy - 广州版 · ICP 过渡期）
# 部署见 deploy/GUANGZHOU_CADDY.md；目标机 = 广州腾讯云轻量 Win Server 2022（81.71.69.17）。
#
# ⚠️ 当前阶段 = ICP 域名未备案，按 docs/MIGRATION_GUANGZHOU_ALLINONE.md P3：
#    先用 `http://<公网IP>:8080` IP 直连过渡，备案完成后再启用下方域名 HTTPS 块。
#    - 因此本配置只监听 :8080（纯 HTTP），不开 :80/:443、不开 auto_https；
#    - 前端（web/dist）静态托管在 C:\opt\quant\web
#    - /api 前缀（REST + SSE）单独 handle 反代到后端引擎 127.0.0.1:8081，SSE 长连接天然透传
#    - 两个 handle 分支按路径互斥：/api/* → 后端；其余（/、/assets/* 等）→ 静态前端
#    - CORS 已由后端 corsMiddleware 全开（*），跨域 APK 走 /api 同样可用

# ICP 过渡期关闭自动 HTTPS：只出 8080 纯 HTTP，避免 80/443 上与未备案域名纠缠
{
	auto_https off
}

:8080 {
	# 传输压缩
	encode gzip

	# 后端 API / SSE（handle 精确匹配 /api 前缀，反代内网引擎）
	handle /api/* {
		reverse_proxy 127.0.0.1:8081
	}

	# 前端静态资源（其余所有路径）
	handle {
		root * C:\opt\quant\web
		file_server
		# §GAP-20260826 缓存策略：index.html 必须 no-cache——它是 SPA 的入口，
		# 浏览器/中间代理若启发式缓存旧 index.html，部署新版后用户仍加载旧 JS bundle，
		# 出现"新功能不存在/数据展示口径陈旧"的假故障。
		# 带 hash 的 /assets/* 内容不可变，可放心长缓存 immutable。
		@html path /
		header @html Cache-Control "no-store"
		@api path /api/*
		header @api Cache-Control "no-store"
		@assets path /assets/*
		header @assets Cache-Control "public, max-age=31536000, immutable"
	}

	# 请求体上限（新闻原文/LLM 咨询可能较大）
	request_body {
		max_size 10MB
	}

	# 日志
	log {
		output file C:\var\log\caddy\quant.access.log {
			roll_size 10MiB
			roll_keep 5
		}
	}
}

