# ================= 翻译助手 translator.quant-trading.top =================
# 独立 Caddyfile 片段：通过主 Caddyfile 的 `import /etc/caddy/translator.conf` 引入。
# 由另一个项目 deploy_seoul.sh 的 `mv /tmp/Caddyfile /etc/caddy/Caddyfile`
# 覆盖主 Caddyfile 时不会影响本文件（translator 配置独立存在）。
# 部署：复制到 /etc/caddy/translator.conf，并在 /etc/caddy/Caddyfile 末尾加
#      `import /etc/caddy/translator.conf`
translator.quant-trading.top {
	# 传输安全与压缩
	encode gzip

	# 后端 API / SSE（反代到翻译助手 127.0.0.1:8787）
	handle /api/* {
		reverse_proxy 127.0.0.1:8787
	}

	# 前端静态资源（SPA fallback 到 index.html，支持 /admin 路径路由）
	handle {
		root * /opt/translator/web
		try_files {path} /index.html
		file_server
	}

	# 请求体上限
	request_body {
		max_size 10MB
	}

	# 日志（独立于 quant 日志；属主为 caddy，避免权限问题）
	log {
		output file /var/log/caddy/translator.access.log {
			roll_size 10MiB
			roll_keep 5
		}
	}
}
