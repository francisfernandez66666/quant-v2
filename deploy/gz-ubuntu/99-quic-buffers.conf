# QUIC/HTTP3 的 UDP 缓冲（Caddy 2.6.2 启动日志会警告）：
#   failed to sufficiently increase receive buffer size (was: 208 kiB,
#   wanted: 2048 KiB, got: 416 KiB)
# 内核默认把 SO_RCVBUF 上限卡在 208 KiB，quic-go 申请 2 MiB 被截断 ⇒ 丢包时
# 拥塞窗口恢复不过来，HTTP/3 吞吐会塌到几 KB/s（2026-11-16 实测同机同 IP：
# h3 中位 7.2 KB/s vs h2 2640 KB/s）。下面的值只是**上限**，不会预先分配内存。
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
