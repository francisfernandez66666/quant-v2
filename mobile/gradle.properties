# Gradle 构建参数
# JVM 内存与并行构建
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AndroidX 必须开启
android.useAndroidX=true

# 仓库：官方 mavenCentral / google
# （国内构建可改为阿里云镜像，见 build_apk.sh 中的说明）

# §GAP2-W1 签名配置已移出本文件（P0：口令曾明文入库）：
# release 签名一律由 scripts/build_apk.sh 通过 ORG_GRADLE_PROJECT_* 环境变量注入，
# 密码从 MOBILE_KEYSTORE_PASS 读取；Android Studio 直接打包需自行在本地提供
# android.injected.signing.* 四项（勿提交）。历史泄漏的口令必须轮换 keystore 并清洗 git 历史。